<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exp 6 - Sugar Bloom Cakes</title>
<style>
  body { font-family: "Comic Sans MS", "Chalkboard SE", cursive; margin: 0; background: #fff6f8; color: #3b2330; font-size: 14px; }
  header { background: #8e2c55; color: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  header h1 { margin: 0 auto 0 0; font-size: 22px; }
  button { background: #8e2c55; color: #fff; border: 0; padding: 7px 12px; border-radius: 15px; cursor: pointer; margin: 2px; }
  header button { background: #fff; color: #8e2c55; }
  .red { background: #555; }
  main { max-width: 980px; margin: 20px auto; padding: 0 15px; }
  form, .box { background: #fff; padding: 15px; border: 1px solid #f0c9d7; max-width: 460px; margin-bottom: 15px; }
  input, select, textarea { width: 100%; padding: 7px; margin: 4px 0; box-sizing: border-box; font-family: inherit; }
  table { width: 100%; border-collapse: collapse; background: #fff; margin: 10px 0; }
  th, td { border: 1px solid #f0c9d7; padding: 6px; text-align: left; }
  th { background: #fbe1ea; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid #f0c9d7; padding: 10px; }
  .card img, .pic { width: 100%; height: 130px; object-fit: cover; background: #fbe1ea; display: flex; align-items: center; justify-content: center; font-size: 50px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters > * { width: auto; flex: 1; min-width: 120px; }
</style>
</head>
<body>
<header><h1>Sugar Bloom Cakes</h1><nav id="nav"></nav></header>
<main>

<section id="shop">
  <h2>Our Cakes</h2>
  <div class="filters">
    <input id="fq" placeholder="Search cake" oninput="r_shop()">
    <select id="fcat" onchange="fillSub(); r_shop()"></select>
    <select id="fsub" onchange="r_shop()"></select>
    <input type="number" id="fmin" placeholder="Min Rs." oninput="r_shop()">
    <input type="number" id="fmax" placeholder="Max Rs." oninput="r_shop()">
  </div>
  <br><div class="grid" id="cakeGrid"></div>
</section>

<section id="detail" hidden>
  <div class="box" id="dBox"></div>
  <form onsubmit="addToCart(event)">
    Size <select id="dsize"><option value="1">0.5 kg</option><option value="2">1 kg (x2 price)</option><option value="4">2 kg (x4 price)</option></select>
    Message on cake <input id="dmsg" placeholder="e.g. Happy Birthday Anu" maxlength="30">
    Quantity <input type="number" id="dqty" value="1" min="1">
    <button>Add to Cart</button>
  </form>
</section>

<section id="cart" hidden>
  <h2>My Cart</h2>
  <div id="cartList"></div>
  <h3>Shipping Address</h3>
  <form onsubmit="saveAddress(event)">
    <input id="an" placeholder="Receiver name" required>
    <input id="aph" placeholder="Phone" required>
    <textarea id="aa" placeholder="Door no, street, area" required></textarea>
    <input id="ac" placeholder="City" required>
    <input id="apin" placeholder="Pincode" required>
    <button>Save Address</button>
  </form>
  <form onsubmit="placeOrder(event)">
    Delivery date <input type="date" id="odate" required>
    Payment <select id="opay"><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select>
    <p id="cartTotal"></p>
    <button>Place Order</button>
  </form>
</section>

<section id="orders" hidden>
  <h2>My Orders</h2>
  <div id="orderList"></div>
</section>

<section id="login" hidden>
  <h2>Login</h2>
  <form onsubmit="login(event)">
    <input id="lu" placeholder="Username" required>
    <input id="lp" type="password" placeholder="Password" required>
    <button>Login</button>
    <p><small>Admin login: admin / admin123</small></p>
  </form>
</section>

<section id="register" hidden>
  <h2>Register</h2>
  <form onsubmit="register(event)">
    <input id="rn" placeholder="Full name" required>
    <input id="ru" placeholder="Username" required>
    <input id="re" type="email" placeholder="Email" required>
    <input id="rp" type="password" placeholder="Password" required>
    <button>Register</button>
  </form>
</section>

<!-- ADMIN -->
<section id="products" hidden>
  <h2>Post Cake Details</h2>
  <form onsubmit="saveCake(event)">
    <input type="hidden" id="cid">
    <input id="cn" placeholder="Cake name" required>
    <input id="ccat" placeholder="Category (Birthday, Wedding...)" required>
    <input id="csub" placeholder="Sub category / flavour (Chocolate, Vanilla...)" required>
    <input type="number" id="cp" placeholder="Price for 0.5 kg" required>
    <textarea id="cd" placeholder="Description" required></textarea>
    Upload image <input type="file" id="cimg" accept="image/*">
    <button>Save Cake</button>
  </form>
  <div id="prodList"></div>
</section>

<section id="adminOrders" hidden>
  <h2>Manage Orders</h2>
  <div id="allOrders"></div>
</section>
</main>

<script>
const db = {
  get: (k, d) => JSON.parse(localStorage.getItem(k)) ?? d,
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
};
const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0, 10);
const STATUSES = ['Placed', 'Baking', 'Out for Delivery', 'Delivered', 'Cancelled'];

if (!db.get('ck_cakes')) db.set('ck_cakes', [
  { id: 1, name: 'Chocolate Truffle', cat: 'Birthday', sub: 'Chocolate', price: 550, desc: 'Dark chocolate sponge with ganache.', img: '' },
  { id: 2, name: 'Red Velvet', cat: 'Anniversary', sub: 'Red Velvet', price: 650, desc: 'Cream cheese frosting, soft red sponge.', img: '' },
  { id: 3, name: 'Butterscotch Crunch', cat: 'Birthday', sub: 'Butterscotch', price: 450, desc: 'Caramel praline on top.', img: '' },
  { id: 4, name: 'Fruit Gateau', cat: 'Wedding', sub: 'Fruit', price: 700, desc: 'Fresh seasonal fruits and whipped cream.', img: '' }
]);
let me = db.get('ck_session', null), curCake = null;

function show(id) {
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== id);
  if (window['r_' + id]) window['r_' + id]();
}
function nav() {
  let b = [['shop', 'Cakes']];
  if (!me) b.push(['login', 'Login'], ['register', 'Register']);
  else if (me.role === 'admin') b.push(['products', 'Manage Products'], ['adminOrders', 'Manage Orders']);
  else b.push(['cart', 'Cart (' + db.get('ck_cart_' + me.user, []).length + ')'], ['orders', 'My Orders']);
  $('nav').innerHTML = b.map(x => `<button onclick="show('${x[0]}')">${x[1]}</button>`).join('') +
    (me ? `<button onclick="logout()">Logout</button>` : '');
}
const pic = c => c.img ? `<img src="${c.img}" alt="${c.name}">` : '<div class="pic">🎂</div>';

// ---------- auth ----------
function register(e) {
  e.preventDefault();
  const users = db.get('ck_users', []);
  if (users.find(u => u.user === $('ru').value)) return alert('Username already taken');
  users.push({ name: $('rn').value, user: $('ru').value, email: $('re').value, pass: $('rp').value });
  db.set('ck_users', users); alert('Registered. Please login.'); e.target.reset(); show('login');
}
function login(e) {
  e.preventDefault();
  const u = $('lu').value, p = $('lp').value;
  if (u === 'admin' && p === 'admin123') me = { user: 'admin', role: 'admin' };
  else if (db.get('ck_users', []).find(x => x.user === u && x.pass === p)) me = { user: u, role: 'user' };
  else return alert('Wrong username or password');
  db.set('ck_session', me); e.target.reset(); nav(); show(me.role === 'admin' ? 'products' : 'shop');
}
function logout() { me = null; localStorage.removeItem('ck_session'); nav(); show('shop'); }

// ---------- shop ----------
function fillCats() {
  const cakes = db.get('ck_cakes', []);
  $('fcat').innerHTML = '<option value="">All categories</option>' + [...new Set(cakes.map(c => c.cat))].map(c => `<option>${c}</option>`).join('');
  fillSub();
}
function fillSub() {
  const cakes = db.get('ck_cakes', []).filter(c => !$('fcat').value || c.cat === $('fcat').value);
  $('fsub').innerHTML = '<option value="">All flavours</option>' + [...new Set(cakes.map(c => c.sub))].map(c => `<option>${c}</option>`).join('');
}
function r_shop() {
  if (!$('fcat').options.length) fillCats();
  const q = $('fq').value.toLowerCase(), cat = $('fcat').value, sub = $('fsub').value;
  const min = +$('fmin').value || 0, max = +$('fmax').value || Infinity;
  const list = db.get('ck_cakes', []).filter(c => c.name.toLowerCase().includes(q) && (!cat || c.cat === cat) && (!sub || c.sub === sub) && c.price >= min && c.price <= max);
  $('cakeGrid').innerHTML = list.length ? list.map(c => `<div class="card">${pic(c)}<h3>${c.name}</h3>${c.cat} / ${c.sub}<br><b>Rs. ${c.price}</b> (0.5 kg)<br>
    <button onclick="openCake(${c.id})">View Details</button></div>`).join('') : '<p>No cakes match your filters.</p>';
}
function openCake(id) {
  curCake = db.get('ck_cakes', []).find(c => c.id === id);
  $('dBox').innerHTML = `${pic(curCake)}<h2>${curCake.name}</h2><p>${curCake.desc}</p><p>${curCake.cat} / ${curCake.sub}</p><p><b>Rs. ${curCake.price}</b> for 0.5 kg</p>`;
  show('detail');
}

// ---------- cart & order ----------
function addToCart(e) {
  e.preventDefault();
  if (!me || me.role !== 'user') { alert('Please login to order'); return show('login'); }
  const cart = db.get('ck_cart_' + me.user, []);
  const mult = +$('dsize').value;
  cart.push({ id: Date.now(), cakeId: curCake.id, name: curCake.name, size: $('dsize').selectedOptions[0].text.split(' (')[0],
    msg: $('dmsg').value, qty: +$('dqty').value, price: curCake.price * mult });
  db.set('ck_cart_' + me.user, cart); e.target.reset(); nav(); alert('Added to cart');
}
function r_cart() {
  const cart = db.get('ck_cart_' + me.user, []);
  $('cartList').innerHTML = cart.length ? '<table><tr><th>Cake</th><th>Size</th><th>Message</th><th>Qty</th><th>Price</th><th></th></tr>' +
    cart.map(c => `<tr><td>${c.name}</td><td>${c.size}</td><td>${c.msg || '-'}</td>
    <td><input type="number" min="1" value="${c.qty}" style="width:60px" onchange="setQty(${c.id}, this.value)"></td>
    <td>Rs. ${c.price * c.qty}</td><td><button class="red" onclick="removeItem(${c.id})">Remove</button></td></tr>`).join('') + '</table>' : '<p>Your cart is empty.</p>';
  $('cartTotal').textContent = 'Total: Rs. ' + cart.reduce((s, c) => s + c.price * c.qty, 0);
  const a = db.get('ck_addr_' + me.user, null);
  if (a) { $('an').value = a.name; $('aph').value = a.phone; $('aa').value = a.addr; $('ac').value = a.city; $('apin').value = a.pin; }
}
function setQty(id, q) {
  const cart = db.get('ck_cart_' + me.user, []);
  cart.find(c => c.id === id).qty = Math.max(1, +q);
  db.set('ck_cart_' + me.user, cart); r_cart();
}
function removeItem(id) { db.set('ck_cart_' + me.user, db.get('ck_cart_' + me.user, []).filter(c => c.id !== id)); nav(); r_cart(); }
function saveAddress(e) {
  e.preventDefault();
  db.set('ck_addr_' + me.user, { name: $('an').value, phone: $('aph').value, addr: $('aa').value, city: $('ac').value, pin: $('apin').value });
  alert('Shipping address saved');
}
function placeOrder(e) {
  e.preventDefault();
  const cart = db.get('ck_cart_' + me.user, []), addr = db.get('ck_addr_' + me.user, null);
  if (!cart.length) return alert('Cart is empty');
  if (!addr) return alert('Save a shipping address first');
  if ($('odate').value < today()) return alert('Pick a delivery date from today onwards');
  const orders = db.get('ck_orders', []);
  orders.push({ id: 'CK' + String(Date.now()).slice(-6), user: me.user, items: cart, addr, date: $('odate').value, pay: $('opay').value,
    total: cart.reduce((s, c) => s + c.price * c.qty, 0), status: 'Placed', location: 'Sugar Bloom kitchen', placedOn: today() });
  db.set('ck_orders', orders); db.set('ck_cart_' + me.user, []);
  alert('Order placed. Confirmation email sent.'); nav(); show('orders');
}
function orderRows(list, admin) {
  if (!list.length) return '<p>No orders yet.</p>';
  return '<table><tr><th>Order</th>' + (admin ? '<th>Customer</th>' : '') + '<th>Items</th><th>Delivery</th><th>Address</th><th>Total</th><th>Status</th><th>Current location</th></tr>' +
    list.map(o => `<tr><td>${o.id}</td>${admin ? `<td>${o.user}</td>` : ''}<td>${o.items.map(i => `${i.name} ${i.size} x${i.qty}${i.msg ? ' ("' + i.msg + '")' : ''}`).join('<br>')}</td>
    <td>${o.date}</td><td>${o.addr.name}, ${o.addr.addr}, ${o.addr.city} - ${o.addr.pin}<br>${o.addr.phone}</td><td>Rs. ${o.total}<br>${o.pay}</td>` +
    (admin ? `<td><select onchange="updateOrder('${o.id}','status',this.value)">${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      <td><input value="${o.location}" onchange="updateOrder('${o.id}','location',this.value)"></td>`
      : `<td>${o.status}</td><td>${o.location}</td>`) + '</tr>').join('') + '</table>';
}
function r_orders() { $('orderList').innerHTML = orderRows(db.get('ck_orders', []).filter(o => o.user === me.user)); }

// ---------- admin ----------
function r_products() {
  $('prodList').innerHTML = '<table><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th></th></tr>' +
    db.get('ck_cakes', []).map(c => `<tr><td style="width:80px">${c.img ? `<img src="${c.img}" width="70">` : '🎂'}</td><td>${c.name}</td><td>${c.cat} / ${c.sub}</td><td>Rs. ${c.price}</td>
    <td><button onclick="editCake(${c.id})">Edit</button><button class="red" onclick="delCake(${c.id})">Delete</button></td></tr>`).join('') + '</table>';
}
function saveCake(e) {
  e.preventDefault();
  const file = $('cimg').files[0];
  const finish = img => {
    const cakes = db.get('ck_cakes', []);
    const data = { name: $('cn').value, cat: $('ccat').value, sub: $('csub').value, price: +$('cp').value, desc: $('cd').value };
    if (img) data.img = img;
    if ($('cid').value) Object.assign(cakes.find(c => c.id == $('cid').value), data);
    else cakes.push({ id: Date.now(), img: '', ...data });
    try { db.set('ck_cakes', cakes); } catch (err) { return alert('Image too large for browser storage. Use a smaller image.'); }
    e.target.reset(); $('cid').value = ''; $('fcat').innerHTML = ''; r_products();
  };
  if (file) { const r = new FileReader(); r.onload = () => finish(r.result); r.readAsDataURL(file); } else finish(null);
}
function editCake(id) {
  const c = db.get('ck_cakes', []).find(x => x.id === id);
  $('cid').value = id; $('cn').value = c.name; $('ccat').value = c.cat; $('csub').value = c.sub; $('cp').value = c.price; $('cd').value = c.desc;
}
function delCake(id) { if (confirm('Delete cake?')) { db.set('ck_cakes', db.get('ck_cakes', []).filter(c => c.id !== id)); $('fcat').innerHTML = ''; r_products(); } }
function r_adminOrders() { $('allOrders').innerHTML = orderRows(db.get('ck_orders', []), true); }
function updateOrder(id, field, val) {
  const orders = db.get('ck_orders', []);
  orders.find(o => o.id === id)[field] = val;
  db.set('ck_orders', orders);
}

nav(); show('shop');
</script>
</body>
</html>
