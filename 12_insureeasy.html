<!DOCTYPE html><html><head><meta charset="utf-8"><title>InsureEasy</title><style>body{font-family:Arial;max-width:760px;margin:20px auto;padding:0 10px}input,select,button,textarea{margin:3px;padding:6px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px}.box{border:1px solid #bbb;padding:10px;margin:10px 0}</style></head><body>
<h2>InsureEasy</h2>
<div id=lg class=box>Role <select id=r><option>admin<option>agent<option>user</select>
<input id=u placeholder="username"> <input id=p type=password placeholder="password">
<button onclick=login()>Login</button> <button onclick=reg()>Register (agent)</button>
<br><small>Admin = admin/admin &nbsp; User = customer name / phone number</small></div>
<div id=admin class=box hidden><h3>Admin - Approve Agents</h3><div id=ag></div></div>
<div id=agent class=box hidden><h3>Agent - Customers &amp; Policies</h3>
<input id=cn placeholder="Customer name"><input id=ph placeholder="Phone"><input id=pol placeholder="Policy (Health/Auto/Home)"><input id=due type=date>
<button onclick=add()>Create Customer</button><div id=cl></div></div>
<div id=user class=box hidden><h3>My Policies</h3><div id=my></div></div>
<script>
const $=i=>document.getElementById(i),L=k=>JSON.parse(localStorage.getItem(k)||"[]"),S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let cur='';
function login(){let r=$('r').value,u=$('u').value,p=$('p').value;
 if(r=='admin'&&(u!='admin'||p!='admin'))return alert('Use admin/admin');
 if(r=='agent'){let a=L('agents').find(x=>x.u==u&&x.p==p);if(!a)return alert('Invalid login');if(!a.ok)return alert('Waiting for admin approval')}
 if(r=='user'&&!L('custs').find(c=>c.n==u&&c.ph==p))return alert('Invalid customer');
 cur=u;$('lg').hidden=true;['admin','agent','user'].forEach(x=>$(x).hidden=(x!=r));show()}
function reg(){let a=L('agents');a.push({u:$('u').value,p:$('p').value,ok:false});S('agents',a);alert('Registered. Wait for admin approval.')}
function approve(i){let a=L('agents');a[i].ok=true;S('agents',a);show()}
function add(){let c=L('custs');c.push({n:$('cn').value,ph:$('ph').value,pol:$('pol').value,due:$('due').value});S('custs',c);show()}
function sms(i){let c=L('custs')[i];alert('SMS to '+c.ph+': Your '+c.pol+' premium is due on '+c.due)}
function show(){
 $('ag').innerHTML='<table><tr><th>Agent<th>Status<th></tr>'+L('agents').map((a,i)=>`<tr><td>${a.u}<td>${a.ok?'Approved':'Pending'}<td>${a.ok?'':`<button onclick="approve(${i})">Approve</button>`}</tr>`).join('')+'</table>';
 $('cl').innerHTML='<table><tr><th>Name<th>Phone<th>Policy<th>Due<th></tr>'+L('custs').map((c,i)=>`<tr><td>${c.n}<td>${c.ph}<td>${c.pol}<td>${c.due}<td><button onclick="sms(${i})">Send SMS</button></tr>`).join('')+'</table>';
 $('my').innerHTML=L('custs').filter(c=>c.n==cur).map(c=>`<p>${c.pol} - premium due on ${c.due}</p>`).join('')}
</script></body></html>
