<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exp 3 - RoadGo Bus Booking</title>
<style>
  body { font-family: Verdana, sans-serif; margin: 0; background: #fbf7ef; color: #2a2118; font-size: 14px; }
  header { background: #c0461b; color: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  header h1 { margin: 0 auto 0 0; font-size: 22px; }
  button { background: #c0461b; color: #fff; border: 0; padding: 7px 12px; border-radius: 4px; cursor: pointer; margin: 2px; }
  header button { background: #fff; color: #c0461b; }
  .red { background: #555; }
  main { max-width: 960px; margin: 20px auto; padding: 0 15px; }
  form, .box { background: #fff; padding: 15px; border: 1px solid #e0d4c0; max-width: 460px; margin-bottom: 15px; }
  input, select, textarea { width: 100%; padding: 7px; margin: 4px 0; box-sizing: border-box; }
  table { width: 100%; border-collapse: collapse; background: #fff; margin: 10px 0; }
  th, td { border: 1px solid #e0d4c0; padding: 6px; text-align: left; }
  th { background: #f6e6d4; }
  .seats { display: grid; grid-template-columns: repeat(4, 45px); gap: 6px; margin: 10px 0; }
  .seat { padding: 8px 0; text-align: center; border: 1px solid #999; cursor: pointer; background: #fff; }
  .seat.taken { background: #ccc; cursor: not-allowed; }
  .seat.pick { background: #c0461b; color: #fff; }
  .news { background: #fff3cd; padding: 8px 12px; margin-bottom: 10px; }
</style>
</head>
<body>
<header><h1>RoadGo Bus</h1><nav id="nav"></nav></header>
<main>

<section id="home">
  <div id="newsBox"></div>
  <h2>Search Buses</h2>
  <form onsubmit="searchBus(event)">
    From <input id="sf" placeholder="e.g. Coimbatore" required>
    To <input id="st" placeholder="e.g. Chennai" required>
    Date <input type="date" id="sd" required>
    <button>Search Buses</button>
  </form>
  <div id="busRes"></div>
</section>

<section id="busView" hidden>
  <h2 id="bvTitle"></h2>
  <div class="box" id="bvInfo"></div>
  <h3>Choose Seats</h3>
  <div class="seats" id="seatMap"></div>
  <form onsubmit="bookTicket(event)">
    <div id="paxFields"></div>
    Payment <select id="pay"><option>Card</option><option>UPI</option><option>Net Banking</option></select>
    <p id="fareTotal"></p>
    <button>Pay and Book</button>
  </form>
  <h3>Comments</h3>
  <div id="cmtList"></div>
  <form onsubmit="addComment(event)">
    <textarea id="cmt" placeholder="Write a comment about this bus" required></textarea>
    <button>Post Comment</button>
  </form>
</section>

<section id="login" hidden>
  <h2>Login</h2>
  <form onsubmit="login(event)">
    <input id="lu" placeholder="Username" required>
    <input id="lp" type="password" placeholder="Password" required>
    <button>Login</button> <a href="#" onclick="show('forgot')">Forgot password?</a>
    <p><small>Admin login: admin / admin123</small></p>
  </form>
</section>

<section id="forgot" hidden>
  <h2>Forgot Password</h2>
  <form onsubmit="resetPass(event)">
    <input id="fu" placeholder="Username" required>
    <input id="fe" type="email" placeholder="Registered email" required>
    <input id="fp" type="password" placeholder="New password" required>
    <button>Reset Password</button>
  </form>
</section>

<section id="register" hidden>
  <h2>Registration</h2>
  <form onsubmit="register(event)">
    <input id="rn" placeholder="Full name" required>
    <input id="ru" placeholder="Username" required>
    <input id="re" type="email" placeholder="Email" required>
    <input id="rp" type="password" placeholder="Password" required>
    <button>Register</button>
  </form>
</section>

<section id="dashboard" hidden>
  <h2>My Bookings</h2>
  <div id="myTickets"></div>
  <h3>Change Password</h3>
  <form onsubmit="changePass(event)">
    <input id="op" type="password" placeholder="Current password" required>
    <input id="np" type="password" placeholder="New password" required>
    <button>Change Password</button>
  </form>
</section>

<!-- ADMIN -->
<section id="adminBus" hidden>
  <h2>Bus Categories</h2>
  <form onsubmit="addCat(event)"><input id="catName" placeholder="e.g. Volvo AC, Sleeper" required><button>Add Category</button></form>
  <div id="catList"></div>
  <h2>Add / Update Bus</h2>
  <form onsubmit="saveBus(event)">
    <input type="hidden" id="bid">
    <input id="bn" placeholder="Bus name / number" required>
    <select id="bc"></select>
    <input id="bf" placeholder="From" required>
    <input id="bt" placeholder="To" required>
    <input type="date" id="bd" required>
    <input type="time" id="btm" required>
    <input type="number" id="bs" placeholder="Total seats" min="4" max="48" required>
    <input type="number" id="bfare" placeholder="Fare per seat" required>
    <input id="bph" placeholder="Photo URL (optional)">
    <textarea id="bdesc" placeholder="Description / tour location"></textarea>
    <button>Save Bus</button>
  </form>
  <div id="busList"></div>
</section>

<section id="adminUsers" hidden>
  <h2>Registered Users</h2><div id="userList"></div>
  <h2>News</h2>
  <form onsubmit="addNews(event)"><input id="newsText" placeholder="News headline" required><button>Post News</button></form>
  <div id="newsList"></div>
  <h2>Comments</h2><div id="allCmts"></div>
</section>

<section id="report" hidden>
  <h2>Booking Report</h2>
  <div id="repBox"></div>
  <button onclick="window.print()">Print Report</button>
</section>
</main>

<script>
const db = {
  get: (k, d) => JSON.parse(localStorage.getItem(k)) ?? d,
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
};
const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0, 10);

if (!db.get('bus_cats')) db.set('bus_cats', ['Volvo AC', 'Sleeper Coach', 'Seater Coach']);
if (!db.get('bus_list')) db.set('bus_list', [
  { id: 1, name: 'TN-38 Volvo Express', cat: 'Volvo AC', from: 'Coimbatore', to: 'Chennai', date: today(), time: '21:30', seats: 32, fare: 950, photo: '', desc: 'Night service with charging points and water bottle.' },
  { id: 2, name: 'Kovai Sleeper', cat: 'Sleeper Coach', from: 'Coimbatore', to: 'Bangalore', date: today(), time: '22:00', seats: 24, fare: 1100, photo: '', desc: 'Berths with blanket.' }
]);
if (!db.get('bus_news')) db.set('bus_news', ['New Volvo service added on the Coimbatore - Chennai route.']);
let me = db.get('bus_session', null), cur = null, picked = [];

function show(id) {
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== id);
  if (window['r_' + id]) window['r_' + id]();
}
function nav() {
  let b = [['home', 'Search']];
  if (!me) b.push(['login', 'Login'], ['register', 'Register']);
  else if (me.role === 'admin') b.push(['adminBus', 'Buses'], ['adminUsers', 'Users & News'], ['report', 'Report']);
  else b.push(['dashboard', 'My Bookings']);
  $('nav').innerHTML = b.map(x => `<button onclick="show('${x[0]}')">${x[1]}</button>`).join('') +
    (me ? `<button onclick="logout()">Logout</button>` : '');
}

// ---------- login module ----------
function register(e) {
  e.preventDefault();
  const users = db.get('bus_users', []);
  if (users.find(u => u.user === $('ru').value)) return alert('Username already taken');
  users.push({ name: $('rn').value, user: $('ru').value, email: $('re').value, pass: $('rp').value });
  db.set('bus_users', users); alert('Registered. Please login.'); e.target.reset(); show('login');
}
function login(e) {
  e.preventDefault();
  const u = $('lu').value, p = $('lp').value;
  if (u === 'admin' && p === 'admin123') me = { user: 'admin', role: 'admin' };
  else if (db.get('bus_users', []).find(x => x.user === u && x.pass === p)) me = { user: u, role: 'user' };
  else return alert('Wrong username or password');
  db.set('bus_session', me); e.target.reset(); nav(); show(me.role === 'admin' ? 'adminBus' : 'home');
}
function logout() { me = null; localStorage.removeItem('bus_session'); nav(); show('home'); }
function resetPass(e) {
  e.preventDefault();
  const users = db.get('bus_users', []);
  const u = users.find(x => x.user === $('fu').value && x.email === $('fe').value);
  if (!u) return alert('Username and email do not match');
  u.pass = $('fp').value; db.set('bus_users', users); alert('Password reset. Please login.'); show('login');
}
function changePass(e) {
  e.preventDefault();
  const users = db.get('bus_users', []);
  const u = users.find(x => x.user === me.user);
  if (u.pass !== $('op').value) return alert('Current password is wrong');
  u.pass = $('np').value; db.set('bus_users', users); e.target.reset(); alert('Password changed');
}

// ---------- search & seats ----------
const takenSeats = busId => db.get('bus_tickets', []).filter(t => t.busId === busId && t.status === 'Booked').flatMap(t => t.seats);
function r_home() {
  $('newsBox').innerHTML = db.get('bus_news', []).map(n => `<div class="news">${n}</div>`).join('');
}
function searchBus(e) {
  e.preventDefault();
  const f = $('sf').value.toLowerCase(), t = $('st').value.toLowerCase(), d = $('sd').value;
  const res = db.get('bus_list', []).filter(b => b.from.toLowerCase() === f && b.to.toLowerCase() === t && b.date === d);
  $('busRes').innerHTML = res.length ? '<table><tr><th>Bus</th><th>Type</th><th>Time</th><th>Fare</th><th>Seats left</th><th></th></tr>' +
    res.map(b => `<tr><td>${b.name}</td><td>${b.cat}</td><td>${b.time}</td><td>Rs. ${b.fare}</td><td>${b.seats - takenSeats(b.id).length}</td>
    <td><button onclick="openBus(${b.id})">View Seats</button></td></tr>`).join('') + '</table>' : '<p>No buses found for this route and date.</p>';
}
function openBus(id) {
  cur = db.get('bus_list', []).find(b => b.id === id); picked = [];
  $('bvTitle').textContent = cur.name;
  $('bvInfo').innerHTML = (cur.photo ? `<img src="${cur.photo}" style="max-width:100%">` : '') +
    `<p>${cur.cat} | ${cur.from} to ${cur.to} | ${cur.date} ${cur.time}</p><p>${cur.desc}</p>`;
  drawSeats(); drawComments(); show('busView');
}
function drawSeats() {
  const taken = takenSeats(cur.id);
  let html = '';
  for (let s = 1; s <= cur.seats; s++)
    html += `<div class="seat ${taken.includes(s) ? 'taken' : ''} ${picked.includes(s) ? 'pick' : ''}" onclick="pickSeat(${s})">${s}</div>`;
  $('seatMap').innerHTML = html;
  $('paxFields').innerHTML = picked.map(s => `<b>Seat ${s}</b><input placeholder="Passenger name" required><input type="number" placeholder="Age" required>`).join('');
  $('fareTotal').textContent = picked.length ? `Total: Rs. ${picked.length * cur.fare}` : 'Select seats above';
}
function pickSeat(s) {
  if (takenSeats(cur.id).includes(s)) return;
  picked = picked.includes(s) ? picked.filter(x => x !== s) : [...picked, s];
  drawSeats();
}
function bookTicket(e) {
  e.preventDefault();
  if (!me || me.role !== 'user') return alert('Please login as a user to book');
  if (!picked.length) return alert('Select at least one seat');
  const inputs = [...$('paxFields').querySelectorAll('input')];
  const pax = picked.map((s, i) => ({ seat: s, name: inputs[i * 2].value, age: inputs[i * 2 + 1].value }));
  const t = db.get('bus_tickets', []);
  t.push({ id: Date.now(), user: me.user, busId: cur.id, seats: picked, pax, amount: picked.length * cur.fare, pay: $('pay').value, status: 'Booked', bookedOn: today() });
  db.set('bus_tickets', t);
  alert('Payment successful. Ticket booked. Confirmation email sent.');
  show('dashboard');
}
function r_dashboard() {
  const buses = db.get('bus_list', []);
  const mine = db.get('bus_tickets', []).filter(t => t.user === me.user);
  $('myTickets').innerHTML = mine.length ? '<table><tr><th>Ticket</th><th>Bus</th><th>Date</th><th>Seats</th><th>Amount</th><th>Status</th><th></th></tr>' +
    mine.map(t => { const b = buses.find(x => x.id === t.busId) || {};
      return `<tr><td>${t.id}</td><td>${b.name}</td><td>${b.date} ${b.time}</td><td>${t.seats.join(', ')}</td><td>Rs. ${t.amount}</td><td>${t.status}</td>
      <td>${t.status === 'Booked' ? `<button class="red" onclick="cancelTicket(${t.id})">Cancel</button>` : ''}</td></tr>`; }).join('') + '</table>' : '<p>No bookings yet.</p>';
}
function cancelTicket(id) {
  if (!confirm('Cancel this ticket?')) return;
  const t = db.get('bus_tickets', []);
  t.find(x => x.id === id).status = 'Cancelled';
  db.set('bus_tickets', t); r_dashboard();
}

// ---------- comments ----------
function drawComments() {
  const c = db.get('bus_comments', []).filter(x => x.busId === cur.id);
  $('cmtList').innerHTML = c.length ? c.map(x => `<p><b>${x.user}:</b> ${x.text}</p>`).join('') : '<p>No comments yet.</p>';
}
function addComment(e) {
  e.preventDefault();
  if (!me) return alert('Login to comment');
  const c = db.get('bus_comments', []);
  c.push({ id: Date.now(), busId: cur.id, user: me.user, text: $('cmt').value });
  db.set('bus_comments', c); e.target.reset(); drawComments();
}

// ---------- admin ----------
function r_adminBus() {
  const cats = db.get('bus_cats', []);
  $('catList').innerHTML = cats.map((c, i) => `${c} <button class="red" onclick="delCat(${i})">x</button>`).join(' | ');
  $('bc').innerHTML = cats.map(c => `<option>${c}</option>`).join('');
  $('busList').innerHTML = '<table><tr><th>Bus</th><th>Type</th><th>Route</th><th>Date</th><th>Seats</th><th></th></tr>' +
    db.get('bus_list', []).map(b => `<tr><td>${b.name}</td><td>${b.cat}</td><td>${b.from} - ${b.to}</td><td>${b.date} ${b.time}</td>
    <td>${b.seats - takenSeats(b.id).length}/${b.seats}</td><td><button onclick="editBus(${b.id})">Edit</button>
    <button class="red" onclick="delBus(${b.id})">Delete</button></td></tr>`).join('') + '</table>';
}
function addCat(e) { e.preventDefault(); const c = db.get('bus_cats', []); c.push($('catName').value); db.set('bus_cats', c); e.target.reset(); r_adminBus(); }
function delCat(i) { const c = db.get('bus_cats', []); c.splice(i, 1); db.set('bus_cats', c); r_adminBus(); }
const busFields = { bn: 'name', bc: 'cat', bf: 'from', bt: 'to', bd: 'date', btm: 'time', bs: 'seats', bfare: 'fare', bph: 'photo', bdesc: 'desc' };
function saveBus(e) {
  e.preventDefault();
  const list = db.get('bus_list', []), data = {};
  for (const f in busFields) data[busFields[f]] = $(f).value;
  data.seats = +data.seats; data.fare = +data.fare;
  if ($('bid').value) Object.assign(list.find(b => b.id == $('bid').value), data);
  else list.push({ id: Date.now(), ...data });
  db.set('bus_list', list); e.target.reset(); $('bid').value = ''; r_adminBus();
}
function editBus(id) {
  const b = db.get('bus_list', []).find(x => x.id === id);
  $('bid').value = id; for (const f in busFields) $(f).value = b[busFields[f]];
}
function delBus(id) { if (confirm('Delete bus?')) { db.set('bus_list', db.get('bus_list', []).filter(b => b.id !== id)); r_adminBus(); } }

function r_adminUsers() {
  const users = db.get('bus_users', []);
  $('userList').innerHTML = '<table><tr><th>Name</th><th>Username</th><th>Email</th><th></th></tr>' +
    users.map(u => `<tr><td>${u.name}</td><td>${u.user}</td><td>${u.email}</td><td><button class="red" onclick="delUser('${u.user}')">Remove</button></td></tr>`).join('') + '</table>';
  $('newsList').innerHTML = db.get('bus_news', []).map((n, i) => `<p>${n} <button class="red" onclick="delNews(${i})">Delete</button></p>`).join('');
  $('allCmts').innerHTML = db.get('bus_comments', []).map(c => `<p>${c.user}: ${c.text} <button class="red" onclick="delCmt(${c.id})">Delete</button></p>`).join('') || '<p>No comments.</p>';
}
function delUser(u) { db.set('bus_users', db.get('bus_users', []).filter(x => x.user !== u)); r_adminUsers(); }
function addNews(e) { e.preventDefault(); const n = db.get('bus_news', []); n.unshift($('newsText').value); db.set('bus_news', n); e.target.reset(); r_adminUsers(); }
function delNews(i) { const n = db.get('bus_news', []); n.splice(i, 1); db.set('bus_news', n); r_adminUsers(); }
function delCmt(id) { db.set('bus_comments', db.get('bus_comments', []).filter(c => c.id !== id)); r_adminUsers(); }

function r_report() {
  const t = db.get('bus_tickets', []);
  const rows = db.get('bus_list', []).map(b => {
    const bt = t.filter(x => x.busId === b.id && x.status === 'Booked');
    return { name: b.name, tickets: bt.length, seats: bt.reduce((s, x) => s + x.seats.length, 0), revenue: bt.reduce((s, x) => s + x.amount, 0) };
  });
  $('repBox').innerHTML = `<p>Users: ${db.get('bus_users', []).length} | Bookings: ${t.filter(x => x.status === 'Booked').length} | Cancelled: ${t.filter(x => x.status === 'Cancelled').length}</p>` +
    '<table><tr><th>Bus</th><th>Tickets</th><th>Seats sold</th><th>Revenue</th></tr>' +
    rows.map(r => `<tr><td>${r.name}</td><td>${r.tickets}</td><td>${r.seats}</td><td>Rs. ${r.revenue}</td></tr>`).join('') +
    `<tr><th>Total</th><th></th><th></th><th>Rs. ${rows.reduce((s, r) => s + r.revenue, 0)}</th></tr></table>`;
}

nav(); show('home');
</script>
</body>
</html>
